[project]
name = "cmms-saas"
version = "0.1.0"
description = "Multi-tenant CMMS SaaS for SMBs: equipment records, preventive maintenance, work orders, audit evidence."
requires-python = ">=3.12"
dependencies = [
    "django>=5,<6",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "pillow>=11.0.0",
    "psycopg[binary]>=3.3.4",
    "segno>=1.6.6",
    "weasyprint>=66",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pre-commit>=4.6.2",
    "pypdf>=5",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.2",
    "time-machine>=3.4.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--reuse-db"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DJ", "B"]
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
