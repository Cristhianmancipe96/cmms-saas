name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cmms
          POSTGRES_USER: cmms
          POSTGRES_PASSWORD: cmms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmms -d cmms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      DEBUG: "False"
      DATABASE_URL: postgresql://cmms:cmms@localhost:5432/cmms

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.29"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest -q
