{% extends "base.html" %}

{% block title %}{% if is_create %}Nuevo ítem{% else %}Editar ítem{% endif %}{% endblock %}

{% block content %}
    <h1>
        {% if is_create %}Nuevo ítem{% else %}Editar ítem{% endif %}
        — {{ template.name }}
    </h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="vt-actions">
            <button type="submit">Guardar</button>
            <a href="{% url 'checklisttemplate_detail' template.pk %}" role="button" class="secondary outline">Cancelar</a>
        </div>
    </form>
{% endblock %}
