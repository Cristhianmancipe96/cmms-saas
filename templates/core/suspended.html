{% extends "base.html" %}

{% block title %}Empresa suspendida{% endblock %}

{% block content %}
    <h1>Empresa suspendida</h1>
    <p>El acceso de tu empresa está suspendido. Contacta al administrador de tu cuenta
        para regularizar la suscripción.</p>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Cerrar sesión</button>
    </form>
{% endblock %}
