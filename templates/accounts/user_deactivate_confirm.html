{% extends "base.html" %}

{% block title %}Desactivar usuario{% endblock %}

{% block content %}
    <h1>Desactivar usuario</h1>
    <p>¿Desactivar a <strong>{{ target.username }}</strong>? No podrá iniciar sesión.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar desactivación</button>
    </form>
    <p><a href="{% url 'user_list' %}">Cancelar</a></p>
{% endblock %}
