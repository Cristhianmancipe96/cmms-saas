{% extends "base.html" %}

{% block title %}Invitar usuario{% endblock %}

{% block content %}
    <h1>Invitar usuario</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="vt-actions">
            <button type="submit">Crear usuario</button>
            <a href="{% url 'user_list' %}" role="button" class="secondary outline">Cancelar</a>
        </div>
    </form>
{% endblock %}
