{% extends "base.html" %}

{% block title %}{% if object %}Editar sitio{% else %}Nuevo sitio{% endif %}{% endblock %}

{% block content %}
    <h1>{% if object %}Editar sitio{% else %}Nuevo sitio{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="vt-actions">
            <button type="submit">Guardar</button>
            <a href="{% if object %}{% url 'site_detail' object.pk %}{% else %}{% url 'site_list' %}{% endif %}"
               role="button" class="secondary outline">Cancelar</a>
        </div>
    </form>
{% endblock %}
