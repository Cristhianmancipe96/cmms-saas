{% extends "base.html" %}

{% block title %}Nueva categoría{% endblock %}

{% block content %}
    <h1>Nueva categoría de equipo</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="vt-actions">
            <button type="submit">Guardar</button>
            <a href="{% url 'assetcategory_list' %}" role="button" class="secondary outline">Cancelar</a>
        </div>
    </form>
{% endblock %}
