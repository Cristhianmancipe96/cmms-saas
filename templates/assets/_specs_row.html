<div class="vt-spec-row grid">
    <input type="text" name="spec_key" placeholder="Campo (p. ej. Voltaje)" value="{{ key }}">
    <input type="text" name="spec_value" placeholder="Valor (p. ej. 220V)" value="{{ value }}">
    <button type="button" class="secondary outline"
            onclick="this.closest('.vt-spec-row').remove()">Quitar</button>
</div>
